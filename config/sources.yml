# NewsTech reads only sources approved here.
# Keep a source disabled until its RSS/Atom endpoint is verified.
sources:
  - id: nvidia-newsroom
    name: NVIDIA Newsroom
    url: https://nvidianews.nvidia.com/releases.xml
    category: pc-hardware
    trust: 100
    enabled: true
    official: true

  - id: microsoft-official-blog
    name: Microsoft Official Blog
    url: https://blogs.microsoft.com/feed/
    category: windows-software
    trust: 100
    enabled: true
    official: true

  - id: openai-news
    name: OpenAI News
    url: https://openai.com/news/rss.xml
    category: ai
    trust: 100
    enabled: true
    official: true
